<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#050608" />
    <meta
      name="description"
      content="AEGIS Research — premium, third-party verified research peptides. For laboratory research use only. Not for human or animal consumption."
    />
    <title>AEGIS Research — Verified Research Materials</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      // Apply the saved theme before first paint to avoid a flash. Defaults to
      // dark. The persisted store is JSON under 'aegis-research-store'.
      (function () {
        try {
          var raw = localStorage.getItem('aegis-research-store');
          var theme = raw && JSON.parse(raw).state && JSON.parse(raw).state.theme;
          var isLight = theme === 'light';
          document.documentElement.classList.toggle('dark', !isLight);
          document.documentElement.style.background = isLight ? '#f3f5f9' : '#050608';
        } catch (e) {
          document.documentElement.classList.add('dark');
          document.documentElement.style.background = '#050608';
        }
      })();
    </script>
    <style>
      html,
      body,
      #root {
        margin: 0;
        min-height: 100%;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
